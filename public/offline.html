<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wazo Digital — Hors ligne</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f5f0e8;
        color: #1a1a1a;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
        background: #fff;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 20px;
        color: #555;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        background: #1b7f4a;
        color: #fff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Vous êtes hors ligne</h1>
      <p>
        Ouvrez l'application une fois connecté pour activer le mode hors ligne.
        Vos données locales restent disponibles si vous avez déjà utilisé Wazo Digital.
      </p>
      <a href="/dashboard">Réessayer</a>
    </div>
  </body>
</html>
